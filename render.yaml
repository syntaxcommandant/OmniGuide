services:
  - type: web
    name: omniguide-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DEFAULT_ANALYSIS_MODE
        value: hybrid
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_MAX_SIZE_MB
        value: "15"
