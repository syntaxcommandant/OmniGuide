services:
  - type: web
    name: omniguide-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_PROVIDER
        value: gemini
      - key: DEFAULT_ANALYSIS_MODE
        value: hybrid
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_MAX_SIZE_MB
        value: "15"
